[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataagent-backend"
version = "0.1.0"
description = "Backend foundation for the Data Scientist Agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "sqlglot>=25.0",
    "sqlalchemy>=2.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
